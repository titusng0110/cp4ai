[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes4ai"
version = "2.0.0"
description = "Convert law notes from DOCX and PDF into recall-first Markdown for LLM ingestion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf==1.28.2",
    "pymupdf4llm==0.3.4",
    "pypandoc-binary==1.17",
    "numpy==2.5.5",
    "tabulate==0.10.0",
    "ocrmac==1.0.1",
    "pillow==13.0.0",
    "tiktoken==0.14.0",
]

[project.scripts]
notes4ai = "notes4ai.cli:main"
cp2ai = "notes4ai.cp2ai:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/notes4ai"]
