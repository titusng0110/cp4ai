[project]
name = "notes4ai"
version = "1.0.0"
description = "Convert law notes from DOCX and PDF into recall-first Markdown for LLM ingestion."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf==1.28.2",
    "pymupdf4llm==0.3.4",
    "pypandoc-binary==1.17",
    "numpy==2.5.5",
    "tabulate==0.10.0",
    "ocrmac==1.0.1",
]

[tool.uv]
package = false
